# Menjalankan lab secara LOKAL memakai image single-container yang sama
# dengan yang dipakai PaaS (build dari ./Dockerfile).
# Lab = OpenSearch Dashboards (visualisasi). Submit jawaban di platform eksternal.
services:
  lab:
    build: .
    image: soc-lab-tainted-input:latest
    container_name: soc-lab-tainted-input
    ports:
      - "5601:5601"
    environment:
      - PORT=5601
      - EVENT_COUNT=9000
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - SCENARIO_DAY=2026-10-11
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -u admin:admin http://localhost:5601/api/status >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 120s
